syntax = "proto3";

package mail_cat.v1;

import "mail_cat/v1/common.proto";

// Search service for full-text message search.
service SearchService {
  // Search messages across all accounts or specific account/mailbox.
  rpc Search(SearchRequest) returns (SearchResponse);

  // Search-as-you-type suggestions (autocomplete).
  rpc Suggest(SuggestRequest) returns (SuggestResponse);

  // Rebuild search index (server-streaming for progress).
  rpc RebuildIndex(RebuildIndexRequest) returns (stream RebuildIndexProgress);
}

// Search hit result with envelope summary.
message SearchHit {
  string message_id = 1;
  float score = 2;
  optional string snippet = 3;  // Highlighted excerpt from body
  string subject = 4;
  optional string from_name = 5;
  string from_email = 6;
  int64 date = 7;               // Unix timestamp
  repeated string mailbox_ids = 8;  // Every mailbox the message is in
}

// === Requests/Responses ===

message SearchRequest {
  string query = 1;
  optional string account_id = 2;  // Filter by account
  optional string mailbox_id = 3;  // Filter by mailbox
  Pagination pagination = 4;
}

message SearchResponse {
  repeated SearchHit hits = 1;
  PageInfo page_info = 2;
}

message SuggestRequest {
  string prefix = 1;
  optional SuggestScope scope = 2;  // If omitted, searches all fields
  uint32 max_per_field = 3;         // Max suggestions per field (default 5)
}

message SuggestResponse {
  repeated Suggestion suggestions = 1;
}

message Suggestion {
  string field = 1;      // e.g. "from_email", "subject"
  string value = 2;      // The suggested value
  uint32 doc_count = 3;  // How many documents contain this value
}

enum SuggestScope {
  SUGGEST_SCOPE_UNSPECIFIED = 0;
  SUGGEST_SCOPE_FROM = 1;
  SUGGEST_SCOPE_TO = 2;
  SUGGEST_SCOPE_SUBJECT = 3;
  SUGGEST_SCOPE_BODY = 4;
}

message RebuildIndexRequest {
  optional string account_id = 1;  // If specified, rebuild only this account
}

// Streaming progress event for rebuild operation.
message RebuildIndexProgress {
  RebuildPhase phase = 1;
  uint32 processed = 2;
  optional uint32 total = 3;
  optional string message = 4;
}

enum RebuildPhase {
  REBUILD_PHASE_UNSPECIFIED = 0;
  REBUILD_PHASE_CLEARING_INDEX = 1;
  REBUILD_PHASE_LOADING_MESSAGES = 2;
  REBUILD_PHASE_INDEXING = 3;
  REBUILD_PHASE_COMPLETE = 4;
  REBUILD_PHASE_ERROR = 5;
}

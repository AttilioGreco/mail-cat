syntax = "proto3";

package mail_cat.v1;

// Label suggestion and auto-apply. Labels are named by their lowercased
// display path; a training group learns them together across its accounts.
service TaggingService {
  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse);
  rpc CreateGroup(CreateGroupRequest) returns (TrainingGroup);
  rpc RenameGroup(RenameGroupRequest) returns (RenameGroupResponse);
  rpc DeleteGroup(DeleteGroupRequest) returns (DeleteGroupResponse);
  // Move an account to a group, or to none (group_id unset).
  rpc AssignAccount(AssignAccountRequest) returns (AssignAccountResponse);

  rpc GetLabelSettings(LabelRef) returns (LabelStatus);
  rpc SetLabelSettings(SetLabelSettingsRequest) returns (LabelStatus);

  // What the classifier suggests for a message and what it applied itself.
  rpc GetMessageTags(MessageTagsRequest) returns (MessageTagsResponse);
  rpc AcceptSuggestion(SuggestionRef) returns (TaggingAck);
  rpc RejectSuggestion(SuggestionRef) returns (TaggingAck);
  rpc UndoAutoLabel(SuggestionRef) returns (TaggingAck);

  rpc PreviewApply(ApplyRequest) returns (ApplyPreview);
  // Saves the mode and labels existing mail in the background.
  rpc ConfirmApply(ApplyRequest) returns (ApplyPreview);

  rpc EvalLabels(EvalRequest) returns (EvalResponse);

  // Local embeddings (nearest-neighbour signal). Off until the user agrees:
  // turning them on downloads the model and embeds the mail in the background.
  rpc GetEmbeddings(GetEmbeddingsRequest) returns (EmbeddingsStatus);
  rpc SetEmbeddings(SetEmbeddingsRequest) returns (EmbeddingsStatus);
  // How hard background embedding and learning may work (always at low OS
  // priority): "light", "normal" or "max". Applies without a restart.
  // What the background work is doing right now (in memory, not stored).
  rpc GetBackgroundStats(GetBackgroundStatsRequest) returns (BackgroundStats);
  rpc SetBackgroundSpeed(SetBackgroundSpeedRequest) returns (EmbeddingsStatus);
  // Which model embeds the mail ("light", "balanced" or "quality") and where
  // it runs. A new model re-embeds the mail in the background.
  rpc SetEmbeddingModel(SetEmbeddingModelRequest) returns (EmbeddingsStatus);
  rpc SetExecutionTarget(SetExecutionTargetRequest) returns (EmbeddingsStatus);

  // Label discovery: groups of similar unlabelled mail proposed as new labels.
  // Starts a search in the background (progress is in GetBackgroundStats);
  // started is false when one is already running.
  rpc DiscoverLabels(DiscoverLabelsRequest) returns (DiscoverLabelsResponse);
  rpc ListLabelProposals(ListLabelProposalsRequest) returns (ListLabelProposalsResponse);
  // Creates the label, puts it on the cluster's mail in the background and
  // teaches the model; the label starts in "suggest".
  rpc AcceptLabelProposal(AcceptLabelProposalRequest) returns (AcceptLabelProposalResponse);
  rpc RejectLabelProposal(RejectLabelProposalRequest) returns (TaggingAck);

  // Curating proposals (for people or assistants driving the CLI).
  // One proposal with sample messages, whatever its status.
  rpc GetLabelProposal(GetLabelProposalRequest) returns (LabelProposalDetail);
  rpc RenameLabelProposal(RenameLabelProposalRequest) returns (LabelProposal);
  // Replaces pending proposals of one scope by one: members are the union,
  // samples and keywords are recomputed. The sources are deleted, not rejected.
  rpc MergeLabelProposals(MergeLabelProposalsRequest) returns (LabelProposal);
  // Like AcceptLabelProposal, but puts a label that already exists in the
  // proposal's group instead of creating one.
  rpc AssignLabelProposal(AssignLabelProposalRequest) returns (AcceptLabelProposalResponse);
  // Existing labels with their settings, per training scope.
  rpc ListLabels(ListLabelsRequest) returns (ListLabelsResponse);
  // One existing label in closer view: where each account keeps it and
  // recent mail under it. One entry per scope that has it.
  rpc GetLabel(GetLabelRequest) returns (GetLabelResponse);
  // Many curation steps as one: everything is checked first and nothing is
  // done unless all of it can be. A plan that fails validation is a
  // FAILED_PRECONDITION error listing every problem, one per line.
  rpc ApplyCurationPlan(ApplyCurationPlanRequest) returns (ApplyCurationPlanResponse);
  // Takes an accepted proposal's label off the mail it was put on, in the
  // background (progress in GetBackgroundStats), unless dry_run.
  rpc UndoLabelProposal(UndoLabelProposalRequest) returns (UndoLabelProposalResponse);
  // Renames an existing label on every account of its group, or merges it
  // into another that exists, in the background unless dry_run.
  rpc RenameLabel(RenameLabelRequest) returns (LabelChangeReport);
  // Takes an existing label off all its mail and deletes it on every account
  // of its group (the mail stays), in the background unless dry_run.
  rpc DeleteLabel(DeleteLabelRequest) returns (LabelChangeReport);
  // Puts a label on all the mail from some senders, domains or mailing lists
  // in the label's training group, creating the label on the accounts that
  // lack it. The model learns it as the user's own. In the background unless
  // dry_run.
  rpc AssignMatchingMail(AssignMatchingRequest) returns (AssignMatchingReport);
  // Labels the existing mail the classifier is sure of, for many labels at
  // once, in the background unless dry_run. Modes are not changed and nothing
  // is archived.
  rpc ApplyAllLabels(ApplyAllRequest) returns (ApplyAllReport);
}

// account_id unset: every training group.
message DiscoverLabelsRequest { optional string account_id = 1; }
message DiscoverLabelsResponse { bool started = 1; }
message ListLabelProposalsRequest {
  // Only the proposals of this account's scope; unset: every scope.
  optional string account_id = 1;
  // "pending" (also when empty), "accepted", "rejected" or "all".
  string status = 2;
  // Fill LabelProposal.senders; reads every member, so costs on large lists.
  bool with_senders = 3;
}
message SenderCount {
  string domain = 1;
  uint32 count = 2;
}
message ProposalSample {
  string message_id = 1;
  string subject = 2;
  string from = 3;
}
message LabelProposal {
  string id = 1;
  string name = 2;
  repeated string keywords = 3;
  uint32 size = 4;
  // Of those, how many are in an Inbox.
  uint32 inbox = 5;
  repeated ProposalSample samples = 6;
  // Name of the training group whose mail it is made of.
  string group = 7;
  int64 created_at = 8;  // Unix seconds
  string status = 9;     // "pending" | "accepted" | "rejected"
  // The training scope ("g:<group id>" or "a:<account id>").
  string scope = 10;
  // Dominant sender domains, most frequent first.
  repeated SenderCount senders = 11;
  // Renamed or merged by hand: discovery keeps it and drops clusters that
  // overlap it.
  bool curated = 12;
}
message ListLabelProposalsResponse { repeated LabelProposal proposals = 1; }
message AcceptLabelProposalRequest {
  string id = 1;
  // The user's name for the label; empty keeps the proposed one.
  string name = 2;
  // Also take the mail out of the Inbox.
  bool archive = 3;
}
message AcceptLabelProposalResponse { uint32 messages = 1; }
message RejectLabelProposalRequest { string id = 1; }
message GetLabelProposalRequest {
  string id = 1;
  uint32 samples = 2;
}
message ProposalMessage {
  string message_id = 1;
  string received_at = 2;  // RFC 3339
  string from = 3;
  string subject = 4;
  // First ~200 characters of the plain text; empty until the body is downloaded.
  string excerpt = 5;
}
message LabelProposalDetail {
  LabelProposal proposal = 1;
  repeated ProposalMessage messages = 2;
}
message RenameLabelProposalRequest {
  string id = 1;
  string name = 2;
}
message MergeLabelProposalsRequest {
  repeated string ids = 1;
  // Empty: named from the merged cluster's keywords.
  string name = 2;
}
message AssignLabelProposalRequest {
  string id = 1;
  string label = 2;  // any case
  bool archive = 3;
}
message ListLabelsRequest {
  optional string account_id = 1;
}
message LabelEntry {
  string name = 1;  // as the group spells it
  LabelStatus status = 2;
}
message LabelScope {
  string scope = 1;
  string group = 2;  // empty for an account that learns alone
  repeated string account_ids = 3;
  repeated LabelEntry labels = 4;
}
message ListLabelsResponse { repeated LabelScope scopes = 1; }

message GetLabelRequest {
  string label = 1;  // any case
  // Only this account's scope; unset: every scope that has the label.
  optional string account_id = 2;
  uint32 samples = 3;
}
message LabelPresence {
  string account_id = 1;
  // "mailbox", "keyword" (no mailbox, its mail carries the keyword) or "missing".
  string kind = 2;
  string mailbox_id = 3;
  string path = 4;
  uint32 messages = 5;      // in the mailbox
  string keyword = 6;
  uint32 examples = 7;      // mail of this account the model learnt it from
}
message LabelDetail {
  string scope = 1;
  string group = 2;
  repeated string account_ids = 3;
  string name = 4;
  LabelStatus status = 5;
  repeated LabelPresence accounts = 6;
  repeated ProposalMessage samples = 7;
}
message GetLabelResponse { repeated LabelDetail labels = 1; }

// kind: "merge" (ids, name, alias), "rename" (id, name), "assign" (id,
// label, archive), "accept" (id, name, archive), "reject" (id), "mode"
// (label, mode, threshold, existing, account_id). An id may be "@alias".
message CurationOp {
  string kind = 1;
  repeated string ids = 2;
  string id = 3;
  string name = 4;
  string label = 5;
  string alias = 6;
  bool archive = 7;
  string mode = 8;
  optional double threshold = 9;
  bool existing = 10;
  optional string account_id = 11;
}
message ApplyCurationPlanRequest {
  repeated CurationOp ops = 1;
  bool dry_run = 2;
}
message AccountCount {
  string account_id = 1;
  uint32 messages = 2;
  uint32 archived = 3;
}
message LabelCreation {
  string name = 1;
  repeated string account_ids = 2;
}
message PlanSummary {
  uint32 merged = 1;
  uint32 renamed = 2;
  uint32 accepted = 3;
  uint32 assigned = 4;
  uint32 rejected = 5;
  uint32 modes = 6;
  repeated LabelCreation labels_to_create = 7;
  repeated string labels_touched = 8;
  uint32 to_label = 9;
  uint32 to_archive = 10;
  repeated AccountCount accounts = 11;
}
message OpResult {
  uint32 index = 1;  // 1-based
  string kind = 2;
  // "planned" (dry run), "done", "failed" or "skipped" (after a failure).
  string status = 3;
  string detail = 4;
  string proposal_id = 5;  // the proposal a merge made
  optional uint32 queued = 6;
}
message ApplyCurationPlanResponse {
  bool dry_run = 1;
  PlanSummary summary = 2;
  repeated OpResult results = 3;
}

message UndoLabelProposalRequest {
  string id = 1;
  bool dry_run = 2;
  // The proposal ends up rejected instead of pending.
  bool reject = 3;
}
message UndoLabelProposalResponse {
  bool dry_run = 1;
  uint32 to_unlabel = 2;
  uint32 to_unarchive = 3;
  repeated AccountCount accounts = 4;
  repeated string labels_to_delete = 5;
  string status = 6;  // what the proposal becomes
}

message RenameLabelRequest {
  string from = 1;
  // A label path ("Dev/GitHub"). One that exists makes this a merge.
  string to = 2;
  // Selects the training group; needed when several have the label.
  optional string account_id = 3;
  bool dry_run = 4;
  // Move only the mail of `from` itself into `to`; `from` and its children
  // stay (`from` goes once empty and childless). `to` may be inside `from`.
  bool mail_only = 5;
}
message DeleteLabelRequest {
  string label = 1;
  optional string account_id = 2;
  bool dry_run = 3;
}
message LabelChangeAccount {
  string account_id = 1;
  // "mailbox", "folder" or "keyword".
  string kind = 2;
  uint32 messages = 3;
  // Rename: some mailbox joins a label the account has already.
  bool merges = 4;
  bool deletes_mailbox = 5;
  // Delete: messages in no other mailbox, filed in the Archive (else Inbox).
  uint32 rehomed = 6;
  // Every mailbox of the label's tree this account changes, parents first.
  repeated LabelChangeMailbox mailboxes = 7;
}
message LabelChangeMailbox {
  string label = 1;
  // Empty when deleting.
  string into = 2;
  // "rename", "merge", "create+move" or "delete".
  string how = 3;
  uint32 messages = 4;
}
message LabelChangeReport {
  bool dry_run = 1;
  string label = 2;
  // Empty when deleting.
  string into = 3;
  bool merge = 4;
  uint32 messages = 5;
  repeated LabelChangeAccount accounts = 6;
  bool mail_only = 7;
}

message AssignMatchingRequest {
  string label = 1;  // a path ("Shopping/Facile"); created where missing
  // Sender addresses ("a@facile.it") or domains ("facile.it", which also
  // covers "remind.facile.it").
  repeated string from = 2;
  // List-Id values, with or without the angle brackets.
  repeated string list_id = 3;
  // Selects the training group; needed when the label is new and there are
  // several groups, or the label is in several.
  optional string account_id = 4;
  // Also take the mail out of the Inbox.
  bool archive = 5;
  bool dry_run = 6;
}
message MatchAccount {
  string account_id = 1;
  uint32 messages = 2;   // to label
  uint32 archived = 3;   // of those, leaving the Inbox
  uint32 already = 4;    // matching mail that has the label
  bool creates = 5;      // the account gets the label created
}
message AssignMatchingReport {
  bool dry_run = 1;
  string label = 2;      // as it is or will be spelled
  uint32 to_label = 3;
  uint32 to_archive = 4;
  uint32 already = 5;    // skipped
  bool creates = 6;
  repeated MatchAccount accounts = 7;
  repeated ApplyPreviewItem sample = 8;
}

// labels empty: every label with enough examples on a dry run, those whose
// mode is not off on a run.
message ApplyAllRequest {
  repeated string labels = 1;
  optional string account_id = 2;  // unset: every training group
  bool dry_run = 3;
}
message LabelApply {
  string scope = 1;
  string name = 2;       // as the group spells it
  string label = 3;      // lowercase key
  string mode = 4;
  double threshold = 5;
  uint32 positives = 6;
  uint32 to_label = 7;   // existing mail the classifier would label
  repeated ApplyPreviewItem sample = 8;
}
message ApplyAllReport {
  bool dry_run = 1;
  repeated LabelApply labels = 2;
  uint32 to_label = 3;
}

message GetEmbeddingsRequest {}
message SetEmbeddingsRequest { bool enabled = 1; }
message EmbeddingsStatus {
  bool enabled = 1;
  // False where the server was built or started without a model.
  bool available = 2;
  // Id and revision of the model in use.
  string model = 3;
  string speed = 4;
  // "light", "balanced" or "quality".
  string profile = 5;
  repeated ModelOption models = 6;
  // "cpu", "gpu-cuda", "gpu-rocm", "gpu-directml", "gpu-coreml", "npu-vitisai".
  string target = 7;
  repeated TargetOption targets = 8;
}
message ModelOption {
  string profile = 1;
  string model = 2;
  uint32 dims = 3;
  uint64 download_bytes = 4;
  // Estimate of the memory each worker holds.
  uint64 worker_bytes = 5;
  // 1 (good) to 3 (best).
  uint32 quality = 6;
}
message TargetOption {
  string id = 1;
  bool available = 2;
}
message SetEmbeddingModelRequest { string profile = 1; }
message SetExecutionTargetRequest { string target = 1; }
message GetBackgroundStatsRequest {}
message BackgroundStats {
  string speed = 1;
  uint32 workers = 2;
  uint32 threads = 3;
  uint32 batch = 4;
  uint32 pause_ms = 5;
  // "off", "loading", "active", "paused_for_retrain" or "idle".
  string state = 6;
  bool model_loaded = 7;
  uint64 embedded = 8;
  uint64 eligible = 9;
  double per_second = 10;
  // 0 when unknown.
  uint64 eta_seconds = 11;
  // 0 when unknown.
  uint64 worker_bytes = 12;
  repeated RetrainProgress retrains = 13;
  // Id and revision of the model in use; empty without one.
  string model = 14;
  // Set while a search for new labels runs.
  optional DiscoveryProgress discovery = 15;
  // Labelling jobs, queued or running (accepted proposals, bulk applies, undos).
  repeated ApplyProgress applying = 16;
}
message ApplyProgress {
  string label = 1;
  string kind = 2;  // "apply" | "undo"
  uint64 done = 3;
  uint64 total = 4;
  // Of done, the messages that left (undo: returned to) the Inbox.
  uint64 archived = 5;
}
message DiscoveryProgress {
  // Training group being searched; empty while starting.
  string scope = 1;
  // "loading", "clustering" or "naming".
  string phase = 2;
  // total is 0 while the phase has no steps to count (clustering).
  uint64 done = 3;
  uint64 total = 4;
}
message RetrainProgress {
  string scope = 1;
  uint64 done = 2;
  uint64 total = 3;
}
message SetBackgroundSpeedRequest { string speed = 1; }

message TrainingGroup {
  string id = 1;
  string name = 2;
  repeated string account_ids = 3;
  bool is_default = 4;
}

message ListGroupsRequest {}
message ListGroupsResponse { repeated TrainingGroup groups = 1; }
message CreateGroupRequest { string name = 1; }
message RenameGroupRequest { string id = 1; string name = 2; }
message RenameGroupResponse {}
message DeleteGroupRequest { string id = 1; }
message DeleteGroupResponse {}
message AssignAccountRequest {
  string account_id = 1;
  optional string group_id = 2;
}
message AssignAccountResponse {}

message LabelRef {
  string account_id = 1;
  string label = 2;  // any case
}

// mode: "off" | "suggest" | "apply" | "apply_archive"
message LabelStatus {
  string label = 1;
  string mode = 2;
  double threshold = 3;
  uint32 positives = 4;
  uint32 min_positives = 5;
}

message SetLabelSettingsRequest {
  string account_id = 1;
  string label = 2;
  string mode = 3;
  double threshold = 4;
}

message MessageTagsRequest { string message_id = 1; }

// confidence: "high" | "medium"
message TagSuggestion {
  string label = 1;
  string mailbox_id = 2;  // empty: a keyword, or no such mailbox yet
  string name = 3;
  string confidence = 4;
}

message AutoLabel {
  string label = 1;
  string mailbox_id = 2;
  string name = 3;
  bool archived = 4;
  int64 at = 5;  // Unix seconds
}

message MessageTagsResponse {
  repeated TagSuggestion suggestions = 1;
  repeated AutoLabel auto = 2;
}

message SuggestionRef {
  string message_id = 1;
  string label = 2;
}

message TaggingAck {}

message ApplyRequest {
  string account_id = 1;
  string label = 2;
  string mode = 3;       // "apply" | "apply_archive"
  double threshold = 4;
}

message ApplyPreviewItem {
  string message_id = 1;
  string subject = 2;
  string from = 3;
}

message ApplyPreview {
  uint32 to_label = 1;
  uint32 to_archive = 2;
  reserved 3;
  repeated ApplyPreviewItem sample = 4;
}

message EvalRequest { string account_id = 1; }

message EvalRow {
  double threshold = 1;
  uint32 flagged = 2;
  uint32 correct = 3;
  double precision = 4;
  double recall = 5;
}

message LabelEval {
  string label = 1;
  uint32 held_out = 2;
  repeated EvalRow rows = 3;     // words and neighbours
  uint32 embedded = 4;           // held-out messages with a vector
  repeated EvalRow bayes_rows = 5;  // words only
}

message EvalResponse { repeated LabelEval labels = 1; }

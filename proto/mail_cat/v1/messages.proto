syntax = "proto3";

package mail_cat.v1;

import "mail_cat/v1/common.proto";

// Message service for email operations.
service MessageService {
  // List messages in a mailbox.
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);

  // Get full message details.
  rpc GetMessage(GetMessageRequest) returns (GetMessageResponse);

  // List conversation summaries for an account (inbox threading view).
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse);

  // Get email thread (conversation).
  rpc GetThread(GetThreadRequest) returns (GetThreadResponse);

  // Rebuild the conversation/thread index by replaying all events.
  rpc RebuildConversationIndex(RebuildConversationIndexRequest) returns (RebuildConversationIndexResponse);

  // Set message flags.
  rpc SetFlags(SetFlagsRequest) returns (SetFlagsResponse);

  // Mark every unread message in a mailbox as read (single provider round-trip).
  rpc MarkMailboxRead(MarkMailboxReadRequest) returns (MarkMailboxReadResponse);

  // Move message to another mailbox.
  rpc MoveMessage(MoveMessageRequest) returns (MoveMessageResponse);

  // Delete message.
  rpc DeleteMessage(DeleteMessageRequest) returns (DeleteMessageResponse);

  // Delete many messages in a single provider round-trip. Partial success is
  // normal (stale index, message already gone) — see BulkChangeResponse.
  rpc DeleteMessages(DeleteMessagesRequest) returns (BulkChangeResponse);

  // Move many messages to one mailbox in a single provider round-trip.
  rpc MoveMessages(MoveMessagesRequest) returns (BulkChangeResponse);

  // Starting state of the compose window: recipients, subject, quote, sender.
  rpc PrepareCompose(PrepareComposeRequest) returns (ComposeView);

  // Build (markdown, signature, quote, attachments) and send a message.
  rpc SendCompose(ComposeInput) returns (SendComposeResponse);

  // Store a draft in the Drafts folder, replacing input.draft_id if set.
  rpc SaveDraft(ComposeInput) returns (SaveDraftResponse);

  // Delete a draft locally and on the server.
  rpc DiscardDraft(DiscardDraftRequest) returns (DiscardDraftResponse);

  // Watch mailbox for real-time updates (server-streaming).
  rpc WatchMailbox(WatchMailboxRequest) returns (stream MailboxEvent);
}

// Message envelope (header summary).
message MessageEnvelope {
  repeated EmailAddress from = 1;
  repeated EmailAddress to = 2;
  repeated EmailAddress cc = 3;
  repeated EmailAddress bcc = 4;
  repeated EmailAddress reply_to = 5;
  string subject = 6;
  Timestamp date = 7;
}

// Attachment info.
message AttachmentInfo {
  string id = 1;
  string filename = 2;
  string mime_type = 3;
  uint64 size_bytes = 4;
  bool is_inline = 5;
  optional string content_id = 6;
}

// Message summary (list view).
message MessageSummary {
  string id = 1;
  string account_id = 2;
  string mailbox_id = 3;
  MessageEnvelope envelope = 4;
  repeated Flag flags = 5;
  uint64 size_bytes = 6;
  bool has_attachments = 7;
  Timestamp received_at = 8;
}

// Message detail (full view with body).
message MessageDetail {
  string id = 1;
  string account_id = 2;
  string mailbox_id = 3;
  optional uint32 provider_uid = 4;
  optional string message_rfc_id = 5;
  optional string in_reply_to = 6;
  repeated string references = 7;
  MessageEnvelope envelope = 8;
  repeated Flag flags = 9;
  uint64 size_bytes = 10;
  repeated AttachmentInfo attachments = 11;
  optional string body_text = 12;
  optional string body_html = 13;
  optional string raw_headers = 14;
  Timestamp received_at = 15;
  Timestamp internal_date = 16;
}

// === Requests/Responses ===

message ListMessagesRequest {
  string mailbox_id = 1;
  Pagination pagination = 2;
}

message ListMessagesResponse {
  repeated MessageSummary messages = 1;
  PageInfo page_info = 2;
}

message GetMessageRequest {
  string message_id = 1;
}

message GetMessageResponse {
  MessageDetail message = 1;
}

// Conversation summary (thread list view).
message ConversationSummary {
  string thread_id = 1;
  string account_id = 2;
  string subject = 3;
  uint32 message_count = 4;
  uint32 unread_count = 5;
  Timestamp last_message_at = 6;
  string latest_sender = 7;
  // A representative domain message UUID — use this to call GetThread.
  string sample_message_id = 8;
}

message ListConversationsRequest {
  string account_id = 1;
  Pagination pagination = 2;
  // When set, scope conversations to this mailbox only (like Thunderbird's
  // per-folder threading) instead of the whole account.
  optional string mailbox_id = 3;
}

message ListConversationsResponse {
  repeated ConversationSummary conversations = 1;
  PageInfo page_info = 2;
}

message GetThreadRequest {
  string message_id = 1;  // Any message in the thread
}

message GetThreadResponse {
  repeated MessageDetail messages = 1;
}

message RebuildConversationIndexRequest {}

message RebuildConversationIndexResponse {
  uint64 events_replayed = 1;
}

message SetFlagsRequest {
  string message_id = 1;
  repeated Flag flags_to_add = 2;
  repeated Flag flags_to_remove = 3;
}

message SetFlagsResponse {
  MessageSummary message = 1;
}

message MarkMailboxReadRequest {
  string mailbox_id = 1;
}

message MarkMailboxReadResponse {
  uint32 marked_count = 1;
}

message MoveMessageRequest {
  string message_id = 1;
  string to_mailbox_id = 2;
}

message MoveMessageResponse {
  MessageSummary message = 1;
}

message DeleteMessageRequest {
  string message_id = 1;
  bool permanently = 2;  // If true, expunge; if false, mark as deleted
}

message DeleteMessagesRequest {
  repeated string message_ids = 1;
  bool permanently = 2;
}

message MoveMessagesRequest {
  repeated string message_ids = 1;
  string to_mailbox_id = 2;
}

// Shared result of a bulk operation. `failed` counts messages skipped because
// they could not be loaded, had no provider UID, or their mailbox was gone —
// the batch continues past them rather than aborting.
message BulkChangeResponse {
  uint32 succeeded = 1;
  uint32 failed = 2;
}

message DeleteMessageResponse {
  bool success = 1;
}

// Compose modes are strings: "new" | "reply" | "replyAll" | "forward" | "draft".
message PrepareComposeRequest {
  string mode = 1;
  optional string message_id = 2;  // source message (or the draft, for "draft")
  optional string account_id = 3;  // preferred sender for "new"
}

message ComposeIdentity {
  string account_id = 1;
  string display_name = 2;
  string email = 3;
  optional string signature_html = 4;
}

// Attachment of an existing message the user may keep ("<message id>:<index>").
message ForwardedAttachment {
  string id = 1;
  string filename = 2;
  uint64 size = 3;
  string mime_type = 4;
}

// Image a restored draft shows inline, referenced as cid:<content_id>.
message InlineImage {
  string content_id = 1;
  string mime_type = 2;
  bytes data = 3;
}

message ComposeView {
  optional string draft_id = 1;
  string account_id = 2;
  repeated ComposeIdentity identities = 3;
  repeated string to = 4;  // "Name <email>" or bare email
  repeated string cc = 5;
  repeated string bcc = 6;
  string subject = 7;
  string body_md = 8;
  optional string quoted_html = 9;
  optional string signature_html = 10;
  repeated ForwardedAttachment forwarded_attachments = 11;
  string mode = 12;
  optional string source_message_id = 13;
  repeated InlineImage inline_images = 14;
}

message ComposeAttachment {
  string filename = 1;
  string mime_type = 2;
  optional string content_id = 3;  // set = inline image referenced as cid:<content_id>
  bytes data = 4;
}

message ComposeInput {
  optional string draft_id = 1;
  string account_id = 2;
  repeated string to = 3;
  repeated string cc = 4;
  repeated string bcc = 5;
  string subject = 6;
  string body_md = 7;
  string mode = 8;
  optional string source_message_id = 9;
  repeated ComposeAttachment attachments = 10;
  repeated string forwarded_attachment_ids = 11;
}

message SendComposeResponse {
  string message_id = 1;  // local id of the sent message (Sent folder)
}

message SaveDraftResponse {
  string draft_id = 1;
}

message DiscardDraftRequest {
  string draft_id = 1;
}

message DiscardDraftResponse {}

message WatchMailboxRequest {
  string mailbox_id = 1;
}

// Streaming event for mailbox changes.
message MailboxEvent {
  string mailbox_id = 1;
  oneof event_type {
    NewMessageEvent new_message = 2;
    FlagsChangedEvent flags_changed = 3;
    MessageExpungedEvent message_expunged = 4;
    CountsChangedEvent counts_changed = 5;
  }
}

message NewMessageEvent {
  string message_id = 1;
  uint32 provider_uid = 2;
}

message FlagsChangedEvent {
  string message_id = 1;
  repeated Flag flags = 2;
}

message MessageExpungedEvent {
  string message_id = 1;
}

message CountsChangedEvent {
  uint32 total = 1;
  uint32 unseen = 2;
}

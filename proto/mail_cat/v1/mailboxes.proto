syntax = "proto3";

package mail_cat.v1;

import "mail_cat/v1/common.proto";

// Mailbox service for managing email folders.
service MailboxService {
  // List mailboxes for an account.
  rpc ListMailboxes(ListMailboxesRequest) returns (ListMailboxesResponse);

  // Get mailbox details.
  rpc GetMailbox(GetMailboxRequest) returns (GetMailboxResponse);

  // Create a new mailbox.
  rpc CreateMailbox(CreateMailboxRequest) returns (CreateMailboxResponse);

  // Rename a mailbox.
  rpc RenameMailbox(RenameMailboxRequest) returns (RenameMailboxResponse);

  // Delete a mailbox.
  rpc DeleteMailbox(DeleteMailboxRequest) returns (DeleteMailboxResponse);

  // Subscribe or unsubscribe a mailbox. Unsubscribed mailboxes are neither
  // shown nor synced and hold no local messages.
  rpc SetMailboxSubscribed(SetMailboxSubscribedRequest) returns (SetMailboxSubscribedResponse);
}

// Mailbox type classification.
enum MailboxType {
  MAILBOX_TYPE_UNSPECIFIED = 0;
  MAILBOX_TYPE_INBOX = 1;
  MAILBOX_TYPE_SENT = 2;
  MAILBOX_TYPE_DRAFTS = 3;
  MAILBOX_TYPE_TRASH = 4;
  MAILBOX_TYPE_SPAM = 5;
  MAILBOX_TYPE_ARCHIVE = 6;
  MAILBOX_TYPE_CUSTOM = 7;
  // RFC 6154 \All — a virtual folder holding every message (Gmail's "All Mail").
  // Gmail exposes no \Archive, so this doubles as its archive target.
  MAILBOX_TYPE_ALL = 8;
  // Gmail's \Important: a label like any other, but told apart so clients can name it.
  MAILBOX_TYPE_IMPORTANT = 9;
  // RFC 6154 \Flagged — the starred messages (Gmail's Starred).
  MAILBOX_TYPE_STARRED = 10;
}

// Mailbox summary.
message MailboxSummary {
  string id = 1;
  string account_id = 2;
  string path = 3;          // opaque provider id (IMAP: the mailbox name); never parse or display
  string display_name = 4;
  MailboxType mailbox_type = 5;
  uint32 total_messages = 6;
  uint32 unread_messages = 7;
  repeated Flag flags = 8;
  string display_path = 9;  // human-readable hierarchy, e.g. "Work/Projects"
  bool subscribed = 10;     // shown in the sidebar and synced
}

// === Requests/Responses ===

message ListMailboxesRequest {
  string account_id = 1;
}

message ListMailboxesResponse {
  repeated MailboxSummary mailboxes = 1;
}

message GetMailboxRequest {
  string mailbox_id = 1;
}

message GetMailboxResponse {
  MailboxSummary mailbox = 1;
}

message CreateMailboxRequest {
  string account_id = 1;
  string path = 2;
}

message CreateMailboxResponse {
  MailboxSummary mailbox = 1;
}

message RenameMailboxRequest {
  string mailbox_id = 1;
  string new_path = 2;
}

message RenameMailboxResponse {
  MailboxSummary mailbox = 1;
}

message DeleteMailboxRequest {
  string mailbox_id = 1;
}

message DeleteMailboxResponse {
  bool success = 1;
}

message SetMailboxSubscribedRequest {
  string mailbox_id = 1;
  bool subscribed = 2;
}

message SetMailboxSubscribedResponse {
  // Set when the server could not be told: the choice then applies locally only.
  string warning = 1;
}

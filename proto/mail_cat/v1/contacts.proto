syntax = "proto3";

package mail_cat.v1;

import "mail_cat/v1/common.proto";

// Contact service — address book search, autocomplete, and merge.
service ContactService {
  // Prefix-match search across display names and email addresses.
  // Designed for low-latency autocomplete in the compose window.
  rpc SearchContacts(SearchContactsRequest) returns (SearchContactsResponse);

  // Find pairs of contacts sharing at least one email address (merge candidates).
  rpc FindContactDuplicates(FindContactDuplicatesRequest) returns (FindContactDuplicatesResponse);

  // Absorb `discard_id` into `keep_id` — emails are merged and the discarded
  // contact is deleted.
  rpc MergeContacts(MergeContactsRequest) returns (MergeContactsResponse);

  // Rebuild the Tantivy contact search index from the stored contact read models.
  // Useful after a fresh install or when the index is lost/corrupted.
  rpc RebuildContactIndex(RebuildContactIndexRequest) returns (RebuildContactIndexResponse);

  // Scan all stored messages and call EnsureContact for every from/to/cc address.
  // Idempotent: existing contacts are left unchanged.
  // Use this after a fresh install to populate the address book from historical mail.
  rpc BackfillContactsFromMessages(BackfillContactsRequest) returns (BackfillContactsResponse);

  // Address books a server holds for the account.
  rpc ListAddressBooks(ListAddressBooksRequest) returns (ListAddressBooksResponse);

  // Contacts synced with a server, with the raw vCard and the sync state.
  rpc ListRemoteContacts(ListRemoteContactsRequest) returns (ListRemoteContactsResponse);

  rpc GetRemoteContact(GetRemoteContactRequest) returns (RemoteContact);

  // The address book is explicit: there is no default one.
  rpc CreateRemoteContact(CreateRemoteContactRequest) returns (CreateRemoteContactResponse);

  rpc UpdateRemoteContact(UpdateRemoteContactRequest) returns (UpdateRemoteContactResponse);

  rpc DeleteRemoteContact(DeleteRemoteContactRequest) returns (DeleteRemoteContactResponse);

  // The card for an address: a remote contact of the account, else any remote
  // one, else a harvested one. No card when nobody has the address.
  rpc LookupContact(LookupContactRequest) returns (LookupContactResponse);

  // Contacts that live only here: harvested from mail, or added by hand.
  rpc ListHarvestedContacts(ListHarvestedContactsRequest) returns (ListHarvestedContactsResponse);
}

// A single result from contact autocomplete.
message ContactSearchHit {
  string id            = 1;
  string display_name  = 2;
  string primary_email = 3;
  repeated string all_emails  = 4;
  optional string organization = 5;
  // Account this contact is scoped to. Empty string = shared across all accounts.
  string account_scope   = 6;
  // True when this hit comes from a different account than the requester.
  bool   is_cross_account = 7;
}

message SearchContactsRequest {
  string query = 1;
  uint32 limit = 2;  // 0 → server default (10)
  // Account making the request — used to sort own-account results first.
  optional string requesting_account_id = 3;
}

message SearchContactsResponse {
  repeated ContactSearchHit hits = 1;
}

message FindContactDuplicatesRequest {
  // Scope to a specific account. Empty = check across all contacts.
  optional string account_id = 1;
}

// A pair of contacts that are candidates for merging.
message ContactDuplicatePair {
  ContactSearchHit keep    = 1;
  ContactSearchHit discard = 2;
}

message FindContactDuplicatesResponse {
  repeated ContactDuplicatePair pairs = 1;
}

message MergeContactsRequest {
  string keep_id    = 1;
  string discard_id = 2;
}

message MergeContactsResponse {}

message RebuildContactIndexRequest {
  // Scope to a specific account. Empty = rebuild all contacts.
  optional string account_id = 1;
}

message RebuildContactIndexResponse {
  // Number of contacts that were successfully (re-)indexed.
  uint32 indexed_count = 1;
}

message BackfillContactsRequest {
  // Scope to a specific account. Empty = process all accounts.
  optional string account_id = 1;
}

message BackfillContactsResponse {
  // Contacts newly created during the backfill.
  uint32 new_contacts = 1;
  // Addresses that already had a contact entry (no-op).
  uint32 already_existed = 2;
}

message AddressBook {
  string collection = 1;
  string name       = 2;
  optional string description = 3;
  bool   read_only  = 4;
}

message ListAddressBooksRequest {
  string account_id = 1;
}

message ListAddressBooksResponse {
  repeated AddressBook address_books = 1;
}

message RemoteContact {
  string id            = 1;
  string account_id    = 2;
  string address_book  = 3;
  string href          = 4;
  // Extracted from the vCard.
  string display_name  = 5;
  repeated string emails = 6;
  repeated string phones = 7;
  optional string organization = 8;
  optional string notes = 9;
  string raw           = 10;
  // A local edit the server has not acknowledged.
  bool   dirty         = 11;
  // Why the server refused the last push.
  optional string push_failed = 12;
}

message ListRemoteContactsRequest {
  string account_id = 1;
  // Unset: every address book of the account.
  optional string address_book = 2;
}

message ListRemoteContactsResponse {
  repeated RemoteContact contacts = 1;
}

message GetRemoteContactRequest {
  string contact_id = 1;
}

message StringList {
  repeated string items = 1;
}

// Unset fields are left as they are; for organization and notes an empty
// string clears the field.
message ContactFields {
  optional string display_name = 1;
  optional StringList emails   = 2;
  optional StringList phones   = 3;
  optional string organization = 4;
  optional string notes        = 5;
}

message CreateRemoteContactRequest {
  string account_id   = 1;
  string address_book = 2;
  ContactFields fields = 3;
}

message CreateRemoteContactResponse {
  string contact_id = 1;
}

message UpdateRemoteContactRequest {
  string contact_id = 1;
  ContactFields fields = 2;
}

message UpdateRemoteContactResponse {}

message DeleteRemoteContactRequest {
  string contact_id = 1;
}

message DeleteRemoteContactResponse {}

enum ContactSource {
  CONTACT_SOURCE_REMOTE    = 0;
  CONTACT_SOURCE_HARVESTED = 1;
}

message ContactCard {
  string id = 1;
  string display_name = 2;
  optional string organization = 3;
  repeated string emails = 4;
  repeated string phones = 5;
  // Remote only: collection path and its name.
  optional string address_book = 6;
  optional string address_book_name = 7;
  // Empty for a harvested contact shared across accounts.
  string account_id = 8;
  optional string notes = 9;
  ContactSource source = 10;
  // Remote only.
  optional string raw = 11;
  bool dirty = 12;
  optional string push_failed = 13;
}

message LookupContactRequest {
  string email = 1;
  // Prefers a contact of this account.
  optional string account_id = 2;
}

message LookupContactResponse {
  optional ContactCard card = 1;
}

message ListHarvestedContactsRequest {}

message ListHarvestedContactsResponse {
  repeated ContactCard contacts = 1;
}

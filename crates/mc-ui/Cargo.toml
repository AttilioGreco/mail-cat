[package]
name = "mc-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mail-cat-ui"
path = "src/main.rs"

[dependencies]
# Tauri
tauri = { version = "2.12", features = ["devtools"] }
# Forwards argv to the already-running window instead of opening a second one,
# which is what makes the notification deep link focus the existing client.
tauri-plugin-single-instance = "2"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
percent-encoding = { workspace = true }
base64 = { workspace = true }
dirs = { workspace = true }
chrono = { workspace = true }

# Client SDK
mc-client = { workspace = true }
tonic = { workspace = true }
mc-shared = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[package]
name = "mc-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mail-cat-server"
path = "src/main.rs"

[dependencies]
mc-shared = { workspace = true }
mc-domain = { workspace = true }
mc-application = { workspace = true }
mc-infrastructure = { workspace = true }
mc-interfaces = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
tonic = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
notify-rust = "4"

# Notification actions must outlive the on-screen banner (notify-rust's
# per-notification listener does not), so we drive the session bus directly.
# Same major as notify-rust's own zbus, so no second copy gets built.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[dev-dependencies]
tempfile = { workspace = true }

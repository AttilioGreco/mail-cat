name: Release

# A tag v* builds installers for Linux, macOS (arm64) and Windows and uploads them,
# with the updater manifest, to a draft GitHub Release; once all three succeed the
# draft is published. A tag with a suffix (v1.2.0-rc1) becomes a pre-release, which
# releases/latest skips, so installed apps are never offered it. See docs/release.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Not 22.04: the static ONNX Runtime that ort downloads needs glibc >= 2.38
          # (__isoc23_strtol). The AppImage runs on glibc 2.39+ (Ubuntu 24.04, Debian 13).
          - os: ubuntu-24.04
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    # The shared OAuth apps are baked into mail-cat-server at compile time
    # (option_env! in mc-infrastructure oauth/presets.rs); without them a release
    # cannot sign in to Gmail or Outlook.
    env:
      MAILCAT_GOOGLE_CLIENT_ID: ${{ secrets.MAILCAT_GOOGLE_CLIENT_ID }}
      MAILCAT_GOOGLE_CLIENT_SECRET: ${{ secrets.MAILCAT_GOOGLE_CLIENT_SECRET }}
      MAILCAT_MICROSOFT_CLIENT_ID: ${{ secrets.MAILCAT_MICROSOFT_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: OAuth client IDs are set
        shell: bash
        run: |
          for v in MAILCAT_GOOGLE_CLIENT_ID MAILCAT_GOOGLE_CLIENT_SECRET MAILCAT_MICROSOFT_CLIENT_ID; do
            [ -n "${!v}" ] || { echo "::error::Secret $v is not set (see docs/release.md)"; missing=1; }
          done
          [ -z "$missing" ]

      - name: Tag matches the app version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tauri_v=$(grep -m1 '"version"' crates/mc-ui/tauri.conf.json | cut -d'"' -f4)
          if [ "$tag" != "$cargo_v" ] || [ "$tag" != "$tauri_v" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml ($cargo_v) / tauri.conf.json ($tauri_v). Bump both (just version-sync), commit, and re-tag."
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: protoc
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libdbus-1-dev libssl-dev pkg-config \
            patchelf rpm

      - name: Server and CLI
        shell: bash
        run: cargo build --release -p mc-server -p mc-cli

      # macOS and Windows ship them as Tauri external binaries, which are looked up by
      # target-triple suffix. On Linux the bundle config maps target/release directly.
      - name: Stage server and CLI for the bundle
        if: runner.os != 'Linux'
        shell: bash
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          mkdir -p crates/mc-ui/binaries
          for bin in mail-cat-server mc; do
            cp "target/release/$bin$ext" "crates/mc-ui/binaries/$bin-$triple$ext"
          done

      - name: Frontend dependencies
        working-directory: crates/mc-ui/src-ui
        run: bun install --frozen-lockfile

      - name: Tauri CLI
        uses: actions/cache@v6
        id: tauri-cli
        with:
          path: ~/.cargo/bin/cargo-tauri${{ runner.os == 'Windows' && '.exe' || '' }}
          key: tauri-cli-2-${{ runner.os }}
      - if: steps.tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/mc-ui
          tauriScript: cargo tauri # the CLI installed above; v1 would otherwise guess from lockfiles
          tagName: ${{ github.ref_name }}
          releaseName: mail-cat ${{ github.ref_name }}
          releaseBody: |
            Installation and first launch (the app is not code-signed): see [docs/install.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/install.md).
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          uploadUpdaterJson: true
          # RPM versions cannot contain '-', which Cargo needs for a pre-release
          # (0.1.3-rc.1): rc builds ship AppImage and deb only.
          args: ${{ (runner.os == 'Linux' && contains(github.ref_name, '-')) && '--bundles appimage,deb' || '' }}

  # Publishing only after every platform uploaded keeps latest.json from pointing
  # installed apps at a release that lacks their platform.
  publish:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --prerelease
          else
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --latest
          fi

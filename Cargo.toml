[workspace]
resolver = "3"
members = [
    "crates/mc-domain",
    "crates/mc-application",
    "crates/mc-infrastructure",
    "crates/mc-interfaces",
    "crates/mc-shared",
    "crates/mc-server",
    "crates/mc-client",
    "crates/mc-cli",
    "crates/mc-ui",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
libc = "0.2"
# Internal crates
mc-domain = { path = "crates/mc-domain" }
mc-application = { path = "crates/mc-application" }
mc-infrastructure = { path = "crates/mc-infrastructure" }
mc-interfaces = { path = "crates/mc-interfaces" }
mc-shared = { path = "crates/mc-shared" }
mc-client = { path = "crates/mc-client" }

# Density-based clustering for label discovery (serial: runs on a niced thread)
hdbscan = "0.12"

# Async runtime
tokio = { version = "1", features = ["full"] }

# gRPC
tonic = "0.14"
tonic-build = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"
prost-types = "0.14"

# GraphQL
async-graphql = "7"
async-graphql-axum = "7"
axum = "0.8"

# Email
async-imap = "0.12.0"
async-native-tls = "0.6"
lettre = { version = "0.11", features = ["tokio1-native-tls"] }
mailparse = "0.18"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
base64 = "0.23"
native-tls = "0.2"
tokio-native-tls = "0.3"

# OAuth2 (Google/Microsoft login for XOAUTH2 IMAP/SMTP)
oauth2 = { version = "5", features = ["reqwest"] }
url = "2"

# JMAP: raw RFC 8620/8621 requests over reqwest.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }

# Storage
rusqlite = { version = "0.41", features = ["bundled", "uuid"] }
zstd = "0.14"

# Search
tantivy = "0.27"

# Local sentence embeddings (ONNX runtime, downloaded at build time). Pinned:
# the model files in `mc-infrastructure/src/embedding` are verified by hash and
# a bump must re-run the ignored real-model test. Our own downloader feeds it
# the bytes, so hf-hub (and a second HTTP stack) stays out.
fastembed = { version = "7.6.1", default-features = false, features = ["ort-download-binaries-native-tls"] }
sha2 = "0.11"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Unique IDs
uuid = { version = "1", features = ["v7", "serde"] }

# Config
toml = "1.2"
toml_edit = "0.25"
dirs = "7"

# Secrets (OS keychain, cross-platform) + config file watching
# v4 `v1` (default) picks the native store per OS; entries keep the v3 service/user keys.
keyring = "4"

# Utilities
futures = "0.3"
async-stream = "0.3"
async-trait = "0.1"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["compat", "rt"] }
bytes = "1"
async-compat = "0.2"
parking_lot = "0.13"

# Testing
tempfile = "3"

# Release + debug info for profiling (samply/perf); see `just install-profiling`.
[profile.profiling]
inherits = "release"
debug = true
